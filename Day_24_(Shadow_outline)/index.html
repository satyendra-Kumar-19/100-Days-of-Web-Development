<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline_and_Shadow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: aquamarine;
        }

        h1 {
            margin: 20px;
            padding: 5px;
            color: greenyellow;
            background-color: black;
            border-radius: 10px;
            border: 5px solid black;
        }

        .box {
            margin: 30px;
            padding: 20px;
            background-color: bisque;
            color: blue;
            font-size: 2em;
            border-radius: 20px;
            border: 4px solid rgb(148, 30, 30);
            box-shadow: 5px 8px 1px 5px #e1db8ea3;
        }

        .box1 {
            margin: 10px;
            padding: 5px;
            background-color: bisque;
            color: blue;
            font-size: 3em;
            border-radius: 20px;
            border: 4px solid rgb(148, 30, 30);
            box-shadow: 2px 5px 1px 3px #ffffff;
            text-shadow: 4px 3px 4px #af0b0b;
        }

        .out {
            margin: 40px;
            background-color: rgb(63, 36, 3);
            color: rgb(106, 106, 245);
            font-size: 1.5em;
            border-radius: 20px;
            border: 4px solid rgb(148, 30, 30);
            outline: 2px solid gray;
            outline-offset: 10px;
        }

        .cont {
            height: 40vh;
            margin: 40px;
            background-color: #af0b0b;
            display: flex;
            justify-content: center;
        }
        .b {
            height: 10vh;
            width: 20vw;
            margin: 40px;
            background-color: #af0b0b;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <h1>
        This is about website is about "outline and shadow"
    </h1>
    <div class="box">
        I am a box for shadow.
    </div>
    <div class="box1">
        I am a box for text-shadow.
    </div>

    <div class="out">
        I am an outline is going to change
    </div>




    <div class="cont">
        <div class="b b1">
            <button> sat1
            </button>
        </div>
        <div class="b b2">
            <button> sat2
            </button>
        </div>
        <div class="b b3">
            <button> sat3
            </button>
        </div>
    </div>
</body>

</html>

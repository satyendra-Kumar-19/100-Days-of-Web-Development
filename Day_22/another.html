<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copy Code Example</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:#f4f4f4;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .code-container{
        position:relative;
        width:700px;
        background:#1e1e1e;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 5px 15px rgba(0,0,0,0.3);
    }

    .copy-btn{
        position:absolute;
        top:12px;
        right:12px;
        background:#333;
        color:#fff;
        border:none;
        border-radius:6px;
        padding:8px 12px;
        cursor:pointer;
        font-size:18px;
        transition:.3s;
    }

    .copy-btn:hover{
        background:#555;
    }

    pre{
        margin:0;
        padding:50px 20px 20px;
        overflow-x:auto;
        color:#d4d4d4;
        font-size:16px;
        line-height:1.6;
    }

    code{
        white-space:pre;
    }
</style>

</head>
<body>

<div class="code-container">

    <button class="copy-btn" id="copyBtn">📋</button>

<pre><code id="code">
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;My First Page&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;h1&gt;Hello World&lt;/h1&gt;
&lt;p&gt;Welcome to HTML.&lt;/p&gt;

&lt;/body&gt;
&lt;/html&gt;
</code></pre>

</div>

<script>
const copyBtn = document.getElementById("copyBtn");
const code = document.getElementById("code");

copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(code.innerText);

    copyBtn.innerHTML = "✔";

    setTimeout(() => {
        copyBtn.innerHTML = "📋";
    }, 1500);
});
</script>

</body>
</html>
